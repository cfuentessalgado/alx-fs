<script>

const state={tasks:[],completedTasks:[],archivedTasks:[],task:null,fileNames:new Map(),routeVersion:0,pendingAnnotation:null,activeAnnotation:null,selectionRoot:null,selectionUuid:null,expandedRoots:new Set(['active']),expandedTasks:new Set(),expandedTypes:new Set()};

async function api(path,options){const r=await fetch(path,options);if(!r.ok)throw new Error((await r.text())||r.statusText);if(r.status===204)return null;const type=r.headers.get('content-type')||'';return type.includes('json')?r.json():r.text()}

function copyMenu(){return '<details class="copy-menu" data-copy-menu><summary class="secondary-button">Copy</summary><div class="copy-menu-list" role="menu"><button type="button" role="menuitem" data-copy="body"><strong>Copy body</strong><span>Raw Markdown content</span></button><button type="button" role="menuitem" data-copy="metadata"><strong>Copy metadata</strong><span>JSON with the read command</span></button><button type="button" role="menuitem" data-copy="command"><strong>Copy read command</strong><span>Paste into a terminal</span></button></div></details>'}
function bindCopyMenu(resource,metadata,command){const menu=viewEl.querySelector('[data-copy-menu]');if(!menu)return;const values={body:resource.body,metadata:JSON.stringify(metadata,null,2),command},labels={body:'Body',metadata:'Metadata',command:'Read command'};menu.querySelectorAll('[data-copy]').forEach(button=>button.onclick=()=>{menu.open=false;copyText(values[button.dataset.copy],labels[button.dataset.copy])})}

function crumbs(items){breadcrumbsEl.innerHTML='';items.forEach((item,index)=>{if(index)breadcrumbsEl.insertAdjacentHTML('beforeend','<span class="separator">/</span>');const b=document.createElement('button');b.className='crumb'+(index===items.length-1?' current':'');b.textContent=item.label;if(Object.hasOwn(item,'path')&&index!==items.length-1)b.onclick=()=>setHash(item.path);breadcrumbsEl.appendChild(b)})}
function taskRoot(task){if(task.archived_at)return{label:'Archived',path:'#/archived'};if(task.completed_at)return{label:'Completed',path:'#/completed'};return{label:'alx',path:''}}

function appendTaskRows(tasks){for(const t of tasks){const selected=state.task&&state.task.task.uuid===t.uuid;const expanded=selected&&state.expandedTasks.has(t.uuid);const taskPath='#/tasks/'+t.uuid;const row=document.createElement('button');row.className='tree-row depth-1'+(selected?' active':'');row.title=t.id;row.setAttribute('aria-expanded',String(expanded));row.innerHTML='<span class="chevron">'+(expanded?'▾':'▸')+'</span>'+icon('folder')+'<span class="label">'+esc(t.id)+'</span>';row.onclick=()=>{if(selected)toggleExpanded(state.expandedTasks,t.uuid);else state.expandedTasks.add(t.uuid);if(location.hash===taskPath)renderTree();else setHash(taskPath)};treeEl.appendChild(row);if(!expanded)continue;const taskFile=document.createElement('button');taskFile.className='tree-row depth-2'+(location.hash.endsWith('/task.md')?' active':'');taskFile.innerHTML='<span class="chevron"></span>'+icon('file')+'<span class="label">task.md</span>';taskFile.onclick=()=>setHash(taskPath+'/task.md');treeEl.appendChild(taskFile);for(const [type,artifacts] of artifactGroups(state.task.artifacts)){const typePath=taskPath+'/types/'+encodeURIComponent(type),key=taskTypeKey(t.uuid,type),typeExpanded=state.expandedTypes.has(key);const folder=document.createElement('button');folder.className='tree-row depth-2'+(location.hash===typePath?' active':'');folder.title=type;folder.setAttribute('aria-expanded',String(typeExpanded));folder.innerHTML='<span class="chevron">'+(typeExpanded?'▾':'▸')+'</span>'+icon('folder')+'<span class="label">'+esc(type)+'</span>';folder.onclick=()=>{toggleExpanded(state.expandedTypes,key);if(location.hash===typePath)renderTree();else setHash(typePath)};treeEl.appendChild(folder);if(typeExpanded)for(const a of artifacts){const child=document.createElement('button');child.className='tree-row depth-3'+(location.hash.endsWith('/artifacts/'+a.uuid)?' active':'');child.title=state.fileNames.get(a.uuid);child.innerHTML='<span class="chevron"></span>'+icon('file')+'<span class="label">'+esc(state.fileNames.get(a.uuid))+'</span>';child.onclick=()=>setHash(taskPath+'/artifacts/'+a.uuid);treeEl.appendChild(child)}}}}
function appendTaskRoot(label,path,key,tasks,query){const expanded=state.expandedRoots.has(key);const root=document.createElement('button');root.className='tree-row'+(location.hash===path?' active':'');root.setAttribute('aria-expanded',String(expanded));root.innerHTML='<span class="chevron">'+(expanded?'▾':'▸')+'</span>'+icon('folder')+'<span class="label">'+esc(label)+(key==='active'?'':' ('+tasks.length+')')+'</span>';root.onclick=()=>{toggleExpanded(state.expandedRoots,key);if(location.hash===path)renderTree();else setHash(path)};treeEl.appendChild(root);if(expanded)appendTaskRows(matchingTasks(tasks,query))}

function openArtifactComposer(task,type=''){artifactFormEl.reset();artifactFormEl.dataset.task=task.uuid;artifactTypeEl.value=type;artifactFormErrorEl.textContent='';artifactSaveEl.disabled=false;artifactSaveEl.textContent='Create artifact';artifactDialogEl.showModal();(type?artifactNameEl:artifactTypeEl).focus()}
async function submitArtifact(){artifactFormErrorEl.textContent='';artifactSaveEl.disabled=true;artifactSaveEl.textContent='Creating…';const taskUuid=artifactFormEl.dataset.task;try{const artifact=await api('/api/tasks/'+encodeURIComponent(taskUuid)+'/artifacts',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({type:artifactTypeEl.value.trim(),name:artifactNameEl.value.trim()||null,body:artifactBodyEl.value})});artifactDialogEl.close();state.task=null;setHash('#/tasks/'+taskUuid+'/artifacts/'+artifact.uuid)}catch(e){artifactFormErrorEl.textContent=e.message||String(e);artifactSaveEl.disabled=false;artifactSaveEl.textContent='Create artifact'}}
async function getTask(uuid){if(state.task&&state.task.task.uuid===uuid)return state.task;const x=await api('/api/tasks/'+encodeURIComponent(uuid));state.task=x;state.fileNames=fileNames(x.artifacts);state.expandedTasks.add(uuid);state.expandedRoots.add(x.task.archived_at?'archived':x.task.completed_at?'completed':'active');for(const type of artifactGroups(x.artifacts).keys())state.expandedTypes.add(taskTypeKey(uuid,type));return x}
function taskActionButtons(task){let lifecycle='';if(task.archived_at)lifecycle='';else if(task.completed_at)lifecycle='<button class="primary-button" data-reopen-task>Reopen</button><button class="secondary-button" data-archive-task>Archive</button>';else lifecycle='<button class="primary-button" data-new-artifact>New artifact</button><button class="secondary-button" data-edit-task>Edit task</button><button class="secondary-button" data-complete-task>Complete</button><button class="secondary-button" data-archive-task>Archive</button>';return '<div class="task-actions">'+copyMenu()+lifecycle+'<button class="danger-button" data-delete-task>Delete permanently</button></div>'}
function bindTaskActions(task){bindCopyMenu(task,taskMetadata(task),taskReadCommand(task));const create=viewEl.querySelector('[data-new-artifact]');if(create)create.onclick=()=>openArtifactComposer(task);const edit=viewEl.querySelector('[data-edit-task]');if(edit)edit.onclick=()=>openTaskEditor(task);const complete=viewEl.querySelector('[data-complete-task]');if(complete)complete.onclick=()=>completeTask(task);const reopen=viewEl.querySelector('[data-reopen-task]');if(reopen)reopen.onclick=()=>reopenTask(task);const archive=viewEl.querySelector('[data-archive-task]');if(archive)archive.onclick=()=>archiveTask(task);viewEl.querySelector('[data-delete-task]').onclick=()=>deleteTask(task)}
async function completeTask(task){try{await api('/api/tasks/'+encodeURIComponent(task.uuid)+'/complete',{method:'POST',headers:{'content-type':'application/json'},body:'{}'});state.task=null;await reloadTaskLists();setHash('#/completed')}catch(e){fail(e)}}
async function reopenTask(task){try{await api('/api/tasks/'+encodeURIComponent(task.uuid)+'/reopen',{method:'POST',headers:{'content-type':'application/json'},body:'{}'});state.task=null;await reloadTaskLists();setHash('#/tasks/'+task.uuid)}catch(e){fail(e)}}
async function archiveTask(task){try{await api('/api/tasks/'+encodeURIComponent(task.uuid)+'/archive',{method:'POST',headers:{'content-type':'application/json'},body:'{}'});state.task=null;await reloadTaskLists();setHash('#/archived')}catch(e){fail(e)}}
async function deleteTask(task){if(!window.confirm('Permanently delete task "'+task.id+'" and all of its artifacts and annotations? This cannot be undone.'))return;try{await api('/api/tasks/'+encodeURIComponent(task.uuid),{method:'DELETE',headers:{'content-type':'application/json'},body:JSON.stringify({confirm:true})});state.task=null;await reloadTaskLists();setHash(task.archived_at?'#/archived':task.completed_at?'#/completed':'')}catch(e){fail(e)}}
function renderDirectory(x){const taskPath='#/tasks/'+x.task.uuid,groups=artifactGroups(x.artifacts);crumbs([taskRoot(x.task),{label:x.task.id}]);renderTree();const taskRow='<tr data-task-file><td><div class="name-cell">'+icon('file')+'<span>task.md</span></div></td><td class="kind">Task</td><td class="meta">'+esc(formatDate(x.task.updated_at))+'</td></tr>';const folders=[...groups].map(([type,artifacts])=>'<tr data-type="'+esc(type)+'"><td><div class="name-cell">'+icon('folder')+'<span>'+esc(type)+'</span></div></td><td class="kind">Artifact folder</td><td class="meta">'+artifacts.length+' file'+(artifacts.length===1?'':'s')+'</td></tr>').join('');viewEl.innerHTML='<section class="directory"><header class="directory-header"><div><h1>'+esc(x.task.id)+'</h1><p>1 task file · '+groups.size+' artifact folder'+(groups.size===1?'':'s')+'</p></div>'+taskActionButtons(x.task)+'</header><table class="file-table"><thead><tr><th>Name</th><th>Kind</th><th>Files</th></tr></thead><tbody>'+taskRow+folders+'</tbody></table></section>';bindDirectoryRows('[data-task-file]',()=>setHash(taskPath+'/task.md'));bindDirectoryRows('[data-type]',row=>setHash(taskPath+'/types/'+encodeURIComponent(row.dataset.type)));bindTaskActions(x.task)}
function renderArtifactDirectory(x,type){const taskPath='#/tasks/'+x.task.uuid,typePath=taskPath+'/types/'+encodeURIComponent(type),artifacts=x.artifacts.filter(a=>a.type===type);crumbs([taskRoot(x.task),{label:x.task.id,path:taskPath},{label:type}]);renderTree();const rows=artifacts.map(a=>'<tr data-artifact="'+esc(a.uuid)+'"><td><div class="name-cell">'+icon('file')+'<span>'+esc(state.fileNames.get(a.uuid))+'</span></div></td><td class="kind">Artifact</td><td class="meta">'+esc(formatDate(a.updated_at))+'</td></tr>').join('');const actions=x.task.archived_at||x.task.completed_at?'':'<div class="task-actions"><button class="primary-button" data-new-artifact>New artifact</button></div>';viewEl.innerHTML='<section class="directory"><header class="directory-header"><div><h1>'+esc(type)+'</h1><p>'+artifacts.length+' artifact'+(artifacts.length===1?'':'s')+'</p></div>'+actions+'</header>'+(rows?'<table class="file-table"><thead><tr><th>Name</th><th>Kind</th><th>Modified</th></tr></thead><tbody>'+rows+'</tbody></table>':'<div class="empty">'+icon('folder')+'<p>No artifacts.</p></div>')+'</section>';const create=viewEl.querySelector('[data-new-artifact]');if(create)create.onclick=()=>openArtifactComposer(x.task,type);bindDirectoryRows('[data-artifact]',row=>setHash(taskPath+'/artifacts/'+row.dataset.artifact))}
function documentHeader(name,kind,updated,size,actions=''){return '<header class="document-head"><div class="document-title">'+icon('file')+'<div><h1>'+esc(name)+'</h1><p>'+esc(kind)+' · '+esc(formatDate(updated))+' · '+esc(formatSize(size))+'</p></div></div>'+actions+'</header>'}
function highlightCode(root){if(!window.hljs||!root)return;for(const code of root.querySelectorAll('pre > code')){if(!code.classList.contains('language-mermaid'))window.hljs.highlightElement(code)}}
function addCodeCopyButtons(root){if(!root)return;for(const code of root.querySelectorAll('pre > code')){const pre=code.parentElement;if(pre.querySelector('[data-copy-code]'))continue;const button=document.createElement('button');button.type='button';button.className='code-copy-button';button.dataset.copyCode='';button.title='Copy code';button.setAttribute('aria-label','Copy code');button.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="8" y="8" width="11" height="11" rx="2"></rect><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"></path></svg>';button.onclick=async()=>{if(await copyText(code.textContent,'Code')){button.classList.add('is-copied');button.title='Copied';button.setAttribute('aria-label','Copied');setTimeout(()=>{button.classList.remove('is-copied');button.title='Copy code';button.setAttribute('aria-label','Copy code')},1600)}};pre.appendChild(button)}}
async function renderMermaid(root){const blocks=[...root.querySelectorAll('pre > code.language-mermaid')];if(!blocks.length)return;for(const code of blocks){const pre=code.parentElement,source=code.textContent;if(!window.mermaid){const message=document.createElement('p');message.className='diagram-error';message.textContent='Mermaid could not load. The diagram source is shown instead.';pre.after(message);continue}const diagram=document.createElement('div');diagram.className='mermaid';diagram.textContent=source;pre.replaceWith(diagram);try{await window.mermaid.run({nodes:[diagram]})}catch(error){console.error('Could not render Mermaid diagram',error);diagram.replaceWith(pre);const message=document.createElement('p');message.className='diagram-error';message.textContent='This Mermaid diagram could not be rendered.';pre.after(message)}}}
function renderTaskDocument(x){const taskPath='#/tasks/'+x.task.uuid;crumbs([taskRoot(x.task),{label:x.task.id,path:taskPath},{label:'task.md'}]);renderTree();viewEl.innerHTML='<div class="reader-shell" style="display:block"><section class="document-pane"><div class="document-card">'+documentHeader('task.md','Task',x.task.updated_at,x.task.body,taskActionButtons(x.task))+'<article class="markdown-body">'+x.rendered_task_html+'</article></div></section></div>';bindTaskActions(x.task);const rendered=viewEl.querySelector('.markdown-body');highlightCode(rendered);addCodeCopyButtons(rendered);renderMermaid(rendered)}
function selectionOffsets(root){const s=window.getSelection();if(!s||s.rangeCount!==1||s.isCollapsed)return null;const r=s.getRangeAt(0).cloneRange(),limits=document.createRange();limits.selectNodeContents(root);let startPosition,endPosition;try{startPosition=limits.comparePoint(r.startContainer,r.startOffset);endPosition=limits.comparePoint(r.endContainer,r.endOffset)}catch{return null}if(startPosition>0||endPosition<0)return null;if(startPosition<0)r.setStart(limits.startContainer,limits.startOffset);if(endPosition>0)r.setEnd(limits.endContainer,limits.endOffset);if(r.collapsed)return null;const before=document.createRange();before.selectNodeContents(root);before.setEnd(r.startContainer,r.startOffset);const rect=r.getBoundingClientRect();return{start_offset:before.toString().length,end_offset:before.toString().length+r.toString().length,selected_text:r.toString(),rect:{left:rect.left,top:rect.top,right:rect.right,bottom:rect.bottom,width:rect.width,height:rect.height}}}
function textNodes(root){const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);const nodes=[];while(walker.nextNode())nodes.push(walker.currentNode);return nodes}
function annotationBounds(root,annotation){const text=root.textContent||'',start=Number(annotation.start_offset),end=Number(annotation.end_offset),quote=annotation.selected_text||'';if(Number.isInteger(start)&&Number.isInteger(end)&&start>=0&&end>start&&end<=text.length&&(!quote||text.slice(start,end).trim()===quote.trim()))return{start,end};if(!quote)return null;let found=text.indexOf(quote),best=-1,distance=Infinity;while(found!==-1){const nextDistance=Number.isFinite(start)?Math.abs(found-start):0;if(nextDistance<distance){best=found;distance=nextDistance}found=text.indexOf(quote,found+1)}return best===-1?null:{start:best,end:best+quote.length}}
function paintAnnotationHighlight(root,annotation,draft=false){const bounds=annotationBounds(root,annotation);if(!bounds)return[];let cursor=0;const targets=[];for(const node of textNodes(root)){const next=cursor+node.data.length;if(next>bounds.start&&cursor<bounds.end)targets.push({node,start:Math.max(0,bounds.start-cursor),end:Math.min(node.data.length,bounds.end-cursor)});cursor=next;if(cursor>=bounds.end)break}const marks=[];for(const target of targets.reverse()){if(target.end<=target.start)continue;const range=document.createRange();range.setStart(target.node,target.start);range.setEnd(target.node,target.end);const mark=document.createElement('mark');mark.className='annotation-highlight kind-'+annotation.kind+(draft?' is-draft':'');mark.dataset.annotationId=annotation.uuid;range.surroundContents(mark);marks.push(mark)}return marks}
function clearDraftHighlights(){const root=document.querySelector('#rendered');if(!root)return;root.querySelectorAll('.annotation-highlight.is-draft').forEach(mark=>mark.replaceWith(...mark.childNodes));root.normalize()}
function paintAnnotationHighlights(root,annotations){annotations.forEach(annotation=>paintAnnotationHighlight(root,annotation))}
function annotationMatches(selector,id){return[...viewEl.querySelectorAll(selector)].filter(element=>element.dataset.annotationId===id)}
function previewAnnotation(id,on){annotationMatches('.annotation-highlight',id).forEach(mark=>mark.classList.toggle('is-preview',on));annotationMatches('[data-annotation-card]',id).forEach(card=>card.classList.toggle('is-preview',on))}
function focusAnnotation(id,scrollTo){state.activeAnnotation=id;viewEl.querySelectorAll('.annotation.is-selected').forEach(card=>card.classList.remove('is-selected'));viewEl.querySelectorAll('.annotation-highlight.is-focused').forEach(mark=>mark.classList.remove('is-focused'));const cards=annotationMatches('[data-annotation-card]',id),marks=annotationMatches('.annotation-highlight',id);cards.forEach(card=>card.classList.add('is-selected'));marks.forEach(mark=>mark.classList.add('is-focused'));const target=scrollTo==='document'?marks[0]:scrollTo==='panel'?cards[0]:null;if(target)target.scrollIntoView({behavior:'smooth',block:'center'})}
function bindAnnotationInteractions(root){viewEl.querySelectorAll('[data-annotation-card]').forEach(card=>{const id=card.dataset.annotationId;card.onclick=event=>{if(event.target.closest('button'))return;focusAnnotation(id,'document')};card.onkeydown=event=>{if((event.key==='Enter'||event.key===' ')&&!event.target.closest('button')){event.preventDefault();focusAnnotation(id,'document')}};card.onmouseenter=()=>previewAnnotation(id,true);card.onmouseleave=()=>previewAnnotation(id,false)});root.querySelectorAll('.annotation-highlight').forEach(mark=>{const id=mark.dataset.annotationId;mark.onclick=event=>{event.preventDefault();event.stopPropagation();focusAnnotation(id,'panel')};mark.onmouseenter=()=>previewAnnotation(id,true);mark.onmouseleave=()=>previewAnnotation(id,false)});if(state.activeAnnotation)focusAnnotation(state.activeAnnotation)}
function hideSelectionMenu(){selectionMenuEl.hidden=true}
function showSelectionMenu(root,uuid){if(annotationDialogEl.open)return;const selected=selectionOffsets(root);if(!selected||!selected.selected_text.trim()){hideSelectionMenu();return}const rect=selected.rect;if(!rect.width&&!rect.height){hideSelectionMenu();return}state.pendingAnnotation={uuid,selected};selectionMenuEl.hidden=false;const width=selectionMenuEl.offsetWidth,height=selectionMenuEl.offsetHeight;selectionMenuEl.style.left=Math.max(10,Math.min(window.innerWidth-width-10,rect.left+rect.width/2-width/2))+'px';const above=rect.top-height-9;selectionMenuEl.style.top=(above>=10?above:Math.min(window.innerHeight-height-10,rect.bottom+9))+'px'}
function bindSelectionMenu(root,uuid){root.addEventListener('pointerdown',()=>{state.selectionRoot=root;state.selectionUuid=uuid});root.addEventListener('keyup',()=>setTimeout(()=>showSelectionMenu(root,uuid)))}
function positionAnnotationDialog(rect){annotationDialogEl.classList.add('annotation-anchored');annotationDialogEl.style.left='';annotationDialogEl.style.top='';if(!rect||window.innerWidth<=700)return;const width=annotationDialogEl.offsetWidth,height=annotationDialogEl.offsetHeight,left=Math.max(14,Math.min(window.innerWidth-width-14,rect.left+rect.width/2-width/2));let top=rect.bottom+12;if(top+height>window.innerHeight-14)top=Math.max(14,rect.top-height-12);annotationDialogEl.style.left=left+'px';annotationDialogEl.style.top=top+'px'}
function openAnnotation(uuid,kind='comment',selected=null){selected=selected||selectionOffsets(document.querySelector('#rendered'));if(!selected||!selected.selected_text.trim()){hideSelectionMenu();fail(new Error('Select text in the document first.'));return}state.pendingAnnotation={uuid,selected,kind};annotationFormEl.reset();annotationKindEl.textContent=kind;annotationKindEl.className='annotation-popover-kind kind-'+kind;composerSelectionEl.textContent=selected.selected_text;composerSelectionEl.title=selected.selected_text;composerErrorEl.textContent='';composerSaveEl.disabled=false;composerSaveEl.textContent='Save';hideSelectionMenu();clearDraftHighlights();paintAnnotationHighlight(document.querySelector('#rendered'),{uuid:'draft',kind,start_offset:selected.start_offset,end_offset:selected.end_offset,selected_text:selected.selected_text},true);window.getSelection()?.removeAllRanges();const scrollX=window.scrollX,scrollY=window.scrollY;annotationDialogEl.show();positionAnnotationDialog(selected.rect);annotationNoteEl.focus({preventScroll:true});if(window.scrollX!==scrollX||window.scrollY!==scrollY)window.scrollTo(scrollX,scrollY)}
async function submitAnnotation(){const pending=state.pendingAnnotation;if(!pending)return;composerErrorEl.textContent='';composerSaveEl.disabled=true;composerSaveEl.textContent='Saving…';const kind=pending.kind,body=annotationNoteEl.value.trim(),{rect,...selection}=pending.selected;try{await api('/api/artifacts/'+pending.uuid+'/annotations',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({...selection,kind,body:body||null})});annotationDialogEl.close();clearDraftHighlights();state.pendingAnnotation=null;window.getSelection()?.removeAllRanges();await showArtifact(pending.uuid,state.routeVersion)}catch(e){composerErrorEl.textContent=e.message||String(e);composerSaveEl.disabled=false;composerSaveEl.textContent='Save'}}
async function resolveAnnotation(id,artifactId){try{await api('/api/annotations/'+id+'/resolve',{method:'POST',headers:{'content-type':'application/json'},body:'{}'});if(state.activeAnnotation===id)state.activeAnnotation=null;await showArtifact(artifactId,state.routeVersion)}catch(e){fail(e)}}
function actionButtons(readOnly){return '<div class="feedback-actions">'+copyMenu()+(readOnly?'':'<button class="action-button" data-annotate>Annotate selection</button>')+'</div>'}
async function showArtifact(uuid,version){const x=await api('/api/artifacts/'+encodeURIComponent(uuid));if(version!==state.routeVersion)return;const task=await getTask(x.artifact.task_uuid);if(version!==state.routeVersion)return;const name=x.artifact.name||state.fileNames.get(uuid)||fallbackName(x.artifact),readOnly=Boolean(task.task.archived_at||task.task.completed_at);const taskPath='#/tasks/'+task.task.uuid,typePath=taskPath+'/types/'+encodeURIComponent(x.artifact.type);state.expandedTypes.add(taskTypeKey(task.task.uuid,x.artifact.type));crumbs([taskRoot(task.task),{label:task.task.id,path:taskPath},{label:x.artifact.type,path:typePath},{label:name}]);renderTree();const annotationHtml=x.annotations.length?x.annotations.map(a=>'<section class="annotation kind-'+esc(a.kind)+'" data-annotation-card data-annotation-id="'+esc(a.uuid)+'" tabindex="0"><div class="annotation-kind">'+esc(a.kind)+'</div>'+(a.selected_text?'<blockquote>'+esc(a.selected_text)+'</blockquote>':'')+(a.body?'<p>'+esc(a.body)+'</p>':'')+(readOnly?'':'<button class="resolve-button" data-resolve="'+esc(a.uuid)+'" title="Remove annotation" aria-label="Remove annotation"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3 6h18M8 6V4h8v2m-9 0 1 14h8l1-14M10 10v6m4-6v6"/></svg>Remove</button>')+'</section>').join(''):'<p class="muted">No unresolved feedback.</p>';viewEl.innerHTML='<div class="reader-shell"><section class="document-pane"><div class="document-card">'+documentHeader(name,'Artifact · '+x.artifact.type,x.artifact.updated_at,x.artifact.body,actionButtons(readOnly))+(readOnly?'':'<p class="selection-hint">Select text to choose a feedback type.</p>')+'<article id="rendered" class="markdown-body">'+x.rendered_html+'</article></div></section><aside class="annotations"><div class="annotations-head"><h2>Feedback</h2><span class="badge">'+x.annotations.length+'</span></div>'+annotationHtml+'</aside></div>';const rendered=viewEl.querySelector('#rendered');bindCopyMenu(x.artifact,artifactMetadata(x.artifact,task.task),artifactReadCommand(x.artifact));const annotate=viewEl.querySelector('[data-annotate]');if(annotate)annotate.onclick=()=>openAnnotation(uuid);viewEl.querySelectorAll('[data-resolve]').forEach(button=>button.onclick=event=>{event.stopPropagation();resolveAnnotation(button.dataset.resolve,uuid)});if(!readOnly)bindSelectionMenu(rendered,uuid);highlightCode(rendered);addCodeCopyButtons(rendered);await renderMermaid(rendered);paintAnnotationHighlights(rendered,x.annotations);bindAnnotationInteractions(rendered)}
async function route(){const version=++state.routeVersion;statusEl.textContent='';const parts=location.hash.replace(/^#\/?/,'').split('/').filter(Boolean);try{if(!parts.length){renderRoot();return}if(parts[0]==='completed'){renderCompletedRoot();return}if(parts[0]==='archived'){renderArchivedRoot();return}if(parts[0]!=='tasks'||!parts[1]){setHash('');return}const x=await getTask(parts[1]);if(version!==state.routeVersion)return;if(parts.length===2){renderDirectory(x);return}if(parts[2]==='task.md'){renderTaskDocument(x);return}if(parts[2]==='types'&&parts[3]){renderArtifactDirectory(x,decodeURIComponent(parts[3]));return}if(parts[2]==='artifacts'&&parts[3]){await showArtifact(parts[3],version);return}setHash('#/tasks/'+parts[1])}catch(e){if(version===state.routeVersion)fail(e)}}
async function start(){try{await reloadTaskLists();renderTree();await route()}catch(e){fail(e)}}
filterEl.addEventListener('input',renderTree);
window.addEventListener('hashchange',()=>{hideSelectionMenu();state.activeAnnotation=null;document.querySelectorAll('dialog[open]').forEach(dialog=>dialog.close());route()});
window.addEventListener('scroll',hideSelectionMenu,true);
window.addEventListener('resize',hideSelectionMenu);
selectionMenuEl.addEventListener('mousedown',event=>event.preventDefault());
selectionMenuEl.querySelectorAll('[data-pop-kind]').forEach(button=>button.addEventListener('click',()=>{const pending=state.pendingAnnotation;if(pending)openAnnotation(pending.uuid,button.dataset.popKind,pending.selected)}));
taskFormEl.addEventListener('submit',event=>{event.preventDefault();submitTask()});
taskEditFormEl.addEventListener('submit',event=>{event.preventDefault();submitTaskEdit()});
artifactFormEl.addEventListener('submit',event=>{event.preventDefault();submitArtifact()});
annotationFormEl.addEventListener('submit',event=>{event.preventDefault();submitAnnotation()});
annotationDialogEl.addEventListener('keydown',event=>{if(event.key==='Escape'){event.preventDefault();annotationDialogEl.close()}});
annotationDialogEl.addEventListener('close',()=>{clearDraftHighlights();state.pendingAnnotation=null;annotationDialogEl.classList.remove('annotation-anchored');annotationDialogEl.style.left='';annotationDialogEl.style.top=''});
document.addEventListener('pointerdown',event=>{if(annotationDialogEl.open&&!annotationDialogEl.contains(event.target)&&!selectionMenuEl.contains(event.target))annotationDialogEl.close()});
document.addEventListener('pointerup',()=>{const root=state.selectionRoot,uuid=state.selectionUuid;state.selectionRoot=null;state.selectionUuid=null;if(root?.isConnected&&uuid)setTimeout(()=>showSelectionMenu(root,uuid))});
document.addEventListener('pointercancel',()=>{state.selectionRoot=null;state.selectionUuid=null});
[[taskFormEl,taskBodyEl],[taskEditFormEl,taskEditBodyEl],[artifactFormEl,artifactBodyEl],[annotationFormEl,annotationNoteEl]].forEach(([form,editor])=>editor.addEventListener('keydown',event=>{if((event.metaKey||event.ctrlKey)&&event.key==='Enter'){event.preventDefault();form.requestSubmit()}}));
document.querySelectorAll('[data-close-dialog]').forEach(button=>button.onclick=()=>button.closest('dialog').close());
document.querySelector('#composer-close').onclick=()=>annotationDialogEl.close();
document.querySelectorAll('dialog').forEach(dialog=>dialog.addEventListener('click',event=>{if(event.target===dialog)dialog.close()}));
start();
</script>
