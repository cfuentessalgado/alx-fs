[package]
name = "alx-fs"
version = "0.2.0"
edition = "2024"
description = "A persistent task artifact store"
repository = "https://github.com/cfuentessalgado/alx-fs"
license = "MIT"

[lib]
name = "alx"

[[bin]]
name = "alx"
path = "src/main.rs"

[dependencies]
ammonia = "4.1"
anyhow = "1.0"
axum = "0.8"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
directories = "6.0"
pulldown-cmark = "0.13"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.47", features = ["macros", "rt-multi-thread", "net"] }
uuid = { version = "1.18", features = ["serde", "v7"] }

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"
tempfile = "3.21"
tower = { version = "0.5", features = ["util"] }
